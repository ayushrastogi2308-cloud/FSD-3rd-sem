<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Starter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="quiz.js" defer></script>
  </head>
  <body class="front-page">
    <div class="container">
      <h1 id="QUIZHEAD">QUIZ</h1>

      <form id="quizForm" class="formpage">
        <label for="studentName">Name :</label>
        <input id="studentName" type="text" placeholder="Enter your name" required />
        <label for="studentroll">ROll number</label>
        <input id="studentroll" type="number" placeholder="Enter your roll number" required/>
        <select for="Section" required>SECTION</select>
        <option value="A">CSE DS A</option>
        <option value="B">CSE DS B</option>
        <option value="C">CSE DS C</option>


        <button type="button" id="start" onclick="startQuiz()" onmouseover="highlightButton(this)">Start Quiz</button>
      </form>
    </div>
  </body>
</html>
